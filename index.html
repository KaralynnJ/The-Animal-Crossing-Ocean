<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <script src="particles.js" defer></script>
    <script src="depthline.js" defer></script>
    <script src="textbox.js" defer></script>
  </head>
  <body>
    <div class="title">
      <div class="sky">
        <div class="sun"></div>
        <div class="moon"></div>
        <div class="stars"></div>
        <h1>The Animal Crossing Ocean</h1>
        <h2>By Karalynn Jones</h2>
      </div>
      <div class="wave-container">
        <div class="waves">
          <div class="wave" id="wave1"></div>
          <div class="wave" id="wave2"></div>
          <div class="wave" id="wave3"></div>
          <div class="wave" id="wave4"></div>
        </div>
      </div>
    </div>
    <div class="wave-transition"></div>
    <div class="ocean">
      <div class="sunlight-zone-background">
        <div class="caustics"></div>
        <div class="alt-caustics"></div>
      </div>
      <div class="sunlight-zone"></div>
      <div class="sunlight-transition"></div>
      <div class="deep-ocean">
        <div class="twilight-zone">
          <div class="twilight-dapple"></div>

          <div class="twilight-transition"></div>
          <div id="particle-container-far" class="particle-container-far"></div>
          <div
            id="particle-container-near"
            class="particle-container-near"
          ></div>
        </div>
      </div>
      <div class="the-creatures">
        <div class="creature-wrapper blowfish">
          <img src="assets/creatures/Blowfish.png" alt="Blowfish" />
        </div>
        <div class="creature-wrapper barred-knifejaw">
          <img
            src="assets/creatures/Barred_Knifejaw.png"
            alt="Barred Knifejaw"
          />
        </div>
        <div class="creature-wrapper seahorse">
          <img src="assets/creatures/Sea_Horse.png" alt="Seahorse" />
        </div>
        <div class="creature-wrapper butterfly-fish">
          <img src="assets/creatures/Butterfly_Fish.png" alt="Butterfly Fish" />
        </div>
        <div class="creature-wrapper clownfish">
          <img src="assets/creatures/Clown_Fish.png" alt="Clown Fish" />
        </div>
        <div class="creature-wrapper surgeon-fish">
          <img src="assets/creatures/Surgeonfish.png" alt="Surgeonfish" />
        </div>
        <div class="creature-wrapper pufferfish">
          <img src="assets/creatures/Puffer_Fish.png" alt="Puffer Fish" />
        </div>
        <div class="creature-wrapper ray">
          <img src="assets/creatures/Ray.png" alt="String Ray" />
        </div>
        <div class="creature-wrapper moray">
          <img src="assets/creatures/Moray_Eel.png" alt="Moray Eel" />
        </div>
        <div class="creature-wrapper anchovy">
          <img src="assets/creatures/Anchovy.png" alt="Anchovy" />
        </div>
        <div class="creature-wrapper ribbon-eel">
          <img src="assets/creatures/Ribbon_Eel.png" alt="Ribbon Eel" />
        </div>
        <div class="creature-wrapper zebra-turkeyfish">
          <img
            src="assets/creatures/Zebra_Turkeyfish.png"
            alt="Zebra Turkeyfish"
          />
        </div>
        <div class="creature-wrapper sturgeon">
          <img src="assets/creatures/Sturgeon.png" alt="Sturgeon" />
        </div>
        <div class="creature-wrapper giant-trevally">
          <img src="assets/creatures/Giant_Trevally.png" alt="Giant Trevally" />
        </div>
        <div class="creature-wrapper mahi-mahi">
          <img src="assets/creatures/Mahi-Mahi.png" alt="Mahi-mahi" />
        </div>
        <div class="creature-wrapper olive-flounder">
          <img src="assets/creatures/Olive_Flounder.png" alt="Olive Flounder" />
        </div>
        <div class="creature-wrapper dab">
          <img src="assets/creatures/Dab.png" alt="Dab" />
        </div>
        <div class="creature-wrapper napoleonfish">
          <img src="assets/creatures/Napoleonfish.png" alt="Napoleonfish" />
        </div>
        <div class="creature-wrapper sea-bass">
          <img src="assets/creatures/Sea_Bass.png" alt="Sea Bass" />
        </div>

        <div class="creature-wrapper suckerfish">
          <img src="assets/creatures/Suckerfish.png" alt="Suckerfish" />
        </div>
        <div class="creature-wrapper great-white">
          <img
            src="assets/creatures/Great_White_Shark.png"
            alt="Great White Shark"
          />
        </div>
        <!-- TWILIGHT -->
        <div class="creature-wrapper horse-mackerel">
          <img src="assets/creatures/Horse_Mackerel.png" alt="Horse Mackerel" />
        </div>
        <div class="creature-wrapper red-snapper">
          <img src="assets/creatures/Red_Snapper.png" alt="Red Snapper" />
        </div>
        <div class="creature-wrapper sea-butterfly">
          <img src="assets/creatures/Sea_Butterfly.png" alt="Sea Butterfly" />
        </div>
        <div class="creature-wrapper mola-mola">
          <img src="assets/creatures/Ocean_Sunfish.png" alt="Ocean Sunfish" />
        </div>
        <div class="creature-wrapper squid">
          <img src="assets/creatures/Squid.png" alt="Squid" />
        </div>
        <div class="creature-wrapper blue-marlin">
          <img src="assets/creatures/Blue_Marlin.png" alt="Blue Marlin" />
        </div>
        <div class="creature-wrapper barreleye">
          <img src="assets/creatures/Barreleye.png" alt="Barreleye" />
        </div>
        <div class="creature-wrapper bluefin-tuna">
          <img src="assets/creatures/Tuna.png" alt="Tuna" />
        </div>
        <div class="creature-wrapper oarfish">
          <img src="assets/creatures/Oarfish.png" alt="Oarfish" />
        </div>
        <div class="creature-wrapper saw-shark">
          <img src="assets/creatures/Saw_Shark.png" alt="Saw Shark" />
        </div>
        <div class="creature-wrapper football-fish">
          <img src="assets/creatures/Football_Fish.png" alt="Football Fish" />
        </div>
        <div class="creature-wrapper salmon">
          <img src="assets/creatures/King_Salmon.png" alt="Salmon" />
        </div>
        <div class="creature-wrapper hammerhead">
          <img
            src="assets/creatures/Hammerhead_Shark.png"
            alt="Hammerhead Shark"
          />
        </div>
        <div class="creature-wrapper whale-shark">
          <img src="assets/creatures/Whale_Shark.png" alt="Whale Shark" />
        </div>
        <div class="creature-wrapper coelacanth">
          <img src="assets/creatures/Coelacanth.png" alt="Coelacanth" />
        </div>
      </div>
      <div id="depth-line" class="depth-line">Meters Deep</div>
    </div>
  </body>
</html>
